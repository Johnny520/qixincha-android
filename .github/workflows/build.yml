name: Build APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses || true

      - name: Install Gradle 8.9
        run: |
          cd /opt
          curl -sL -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip
          echo "/opt/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Build Release APK
        run: gradle assembleRelease

      - name: Rename APK
        run: |
          cd app/build/outputs/apk/release
          mv *.apk qixincha-java-${{ github.ref_name }}.apk

      - name: Release APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/qixincha-java-${{ github.ref_name }}.apk
          name: 企信查 Java 版 ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            企信查 Java 原生 Android 版
            包名：com.qxx.johnny
            兼容：Android 7–16（官方 SDK，无第三方运行时，闪退风险最低）
